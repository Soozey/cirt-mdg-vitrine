services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_USE_FIREBASE_EMULATOR: ${VITE_USE_FIREBASE_EMULATOR}
    container_name: cybersec-summit
    ports:
      - "2220:2220"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=2220
      - HOST=0.0.0.0
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-adminsdk.json
    volumes:
      - ${FIREBASE_ADMINSDK_FILE:-./jobdating-cybersec-firebase-adminsdk-fbsvc-772b247bba.json}:/run/secrets/firebase-adminsdk.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2220/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
